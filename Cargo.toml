[package]
name = "sb-ssh"
version = "0.1.0"
edition = "2021"
description = "S&B NetGate (sb-ssh) — Modern OAuth-secured SSH CLI with ephemeral certificates & TUI"
authors = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/skulls-and-bones/sb-ssh"
homepage = "https://skulls-and-bones.org"
keywords = ["ssh", "security", "zero-trust", "tui", "netgate"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
tiny_http = "0.12"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
crossterm = "0.28"
ratatui = "0.29"
dirs = "6.0"
sha2 = "0.10"
base64 = "0.22"
russh = { version = "0.63.2", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "2.4.0"
clap_complete = "4.5"

