    .txt-white { font-size: 12px; fill: #F3F4F6; }
    .txt-dim { font-size: 11px; fill: #9CA3AF; }
    .badge-ok { fill: #10B981; font-weight: 700; }
    .badge-active { fill: #F59E0B; font-weight: 700; }
    .cast-file { fill: #EC4899; font-weight: 600; }
  </style>

  <g filter="url(#shadow2)">
